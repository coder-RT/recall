room:
  get:
    tags: [homes]
    operationId: getRoomModel
    summary: The home's room model (floor polygon, walls, furniture boxes) for the phone's 3D map
    parameters:
      - $ref: ../schemas/Params.yaml#/home_id
    responses:
      "200":
        description: Room model
        content:
          application/json:
            schema:
              $ref: ../schemas/RoomModel.yaml
      "404":
        $ref: ../schemas/Responses.yaml#/NotFound
room_map:
  get:
    tags: [homes]
    operationId: getRoomMap
    summary: One room's map and the things in it, for the owner's phone (the same document a robot gets)
    description: >
      The owner's view of a room: the occupancy map, the things on it and the room outline, in the robot export's
      format. Device key only; works whether robot access is on or off, and isn't recorded as a robot export.
      `room` picks a room; the default is the newest processed scan's.
    parameters:
      - $ref: ../schemas/Params.yaml#/home_id
      - name: room
        in: query
        required: false
        schema: {type: string}
    responses:
      "200":
        description: The room's map
        content:
          application/json:
            schema:
              $ref: ../schemas/RobotExport.yaml
      "404":
        $ref: ../schemas/Responses.yaml#/NotFound
      "409":
        description: The scan's point cloud is missing; process the scan again
        content:
          application/json:
            schema: {$ref: ../schemas/Error.yaml}
robot_export:
  get:
    tags: [robots]
    operationId: getRobotExport
    summary: One room's memory for a robot (Nav2 map, things, furniture); off unless the owner turns it on
    description: >
      Read-only. A robot needs robot access on (PUT /sharing, or ROBOT_EXPORT_ENABLED=true on the Mac) and the robot
      key (RECALL_ROBOT_KEY); the owner's device key can always export it, to share it.
      `room` picks a room; the default is the newest processed scan's.
    security:
      - deviceKey: []
    parameters:
      - $ref: ../schemas/Params.yaml#/home_id
      - name: room
        in: query
        required: false
        schema: {type: string}
    responses:
      "200":
        description: The export
        content:
          application/json:
            schema:
              $ref: ../schemas/RobotExport.yaml
      "403":
        description: Robot access is off
        content:
          application/json:
            schema: {$ref: ../schemas/Error.yaml}
      "404":
        $ref: ../schemas/Responses.yaml#/NotFound
robot_package:
  get:
    tags: [robots]
    operationId: getRobotPackage
    summary: One room's memory for a robot as a .zip of files it loads (Nav2 map, things, room, 3D points, README)
    description: >
      The same content as the robot export, as files: map.pgm and map.yaml (Nav2 map server), objects.json,
      room.json, cloud.ply (x y z, metres, z up) and README.md. Same access as the robot export: the owner's device
      key always (to share it from the phone), a robot's key only while robot access is on. Recorded in the audit.
    security:
      - deviceKey: []
    parameters:
      - $ref: ../schemas/Params.yaml#/home_id
      - name: room
        in: query
        required: false
        schema: {type: string}
    responses:
      "200":
        description: The package
        content:
          application/zip:
            schema: {type: string, format: binary}
      "403":
        description: Robot access is off
        content:
          application/json:
            schema: {$ref: ../schemas/Error.yaml}
      "404":
        $ref: ../schemas/Responses.yaml#/NotFound
      "409":
        description: The scan's point cloud is missing; process the scan again
        content:
          application/json:
            schema: {$ref: ../schemas/Error.yaml}
