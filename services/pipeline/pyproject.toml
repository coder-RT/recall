[project]
name = "recall-pipeline"
version = "0.1.0"
description = "Recall's scan pipeline: MapAnything, SAM 3.1, planes, objects and room.json (classic geometry only)"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "numpy>=2.1",
  "scipy>=1.14",
  "httpx>=0.28",
  "pyyaml>=6.0",
  "pillow>=11",
  "open3d>=0.19",
  "shapely>=2.0",
  "opencv-python-headless>=4.10",
  "torch>=2.5",
  "mapanything @ git+https://github.com/facebookresearch/map-anything@3d10cf7",
]

[project.scripts]
recall-pipeline = "recall_pipeline.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
  "import-linter>=2.1",
  "rerun-sdk>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recall_pipeline"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.importlinter]
root_package = "recall_pipeline"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Hexagonal layers"
type = "layers"
layers = [
  "recall_pipeline.cli",
  "recall_pipeline.adapters",
  "recall_pipeline.application",
  "recall_pipeline.domain",
]

[[tool.importlinter.contracts]]
name = "Domain and application stay free of models, frameworks and I/O"
type = "forbidden"
source_modules = ["recall_pipeline.domain", "recall_pipeline.application"]
forbidden_modules = ["torch", "mapanything", "open3d", "cv2", "httpx", "rerun"]
