[project]
name = "recall-api"
version = "0.1.0"
description = "Recall's API: memory, Guide agent, guidance and verification (hexagonal, DDD)"
requires-python = ">=3.12,<3.13"
license = "Apache-2.0"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0",
  "alembic>=1.14",
  "httpx>=0.28",
  "numpy>=2.1",
  "scipy>=1.14",
  "pyyaml>=6.0",
  "python-multipart>=0.0.12",
  "opentelemetry-sdk>=1.30",
  "opentelemetry-exporter-otlp-proto-http>=1.30",
  "opentelemetry-instrumentation-fastapi>=0.51b0",
  "opentelemetry-instrumentation-httpx>=0.51b0",
  "huey>=2.5",
  "a2a-sdk[http-server]>=1.3.0",
]

[project.scripts]
recall-api = "recall_api.infra.app:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
  "import-linter>=2.1",
  "datamodel-code-generator[http]>=0.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recall_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["src/recall_api/adapters/inbound/http/models.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies as argument defaults by design
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query", "fastapi.File", "fastapi.Form"]

[tool.importlinter]
root_package = "recall_api"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Hexagonal layers"
type = "layers"
layers = [
  "recall_api.infra",
  "recall_api.adapters",
  "recall_api.application",
  "recall_api.domain",
]

[[tool.importlinter.contracts]]
name = "Domain and application stay free of frameworks and I/O"
type = "forbidden"
source_modules = ["recall_api.domain", "recall_api.application"]
forbidden_modules = ["fastapi", "sqlalchemy", "httpx", "openai", "torch", "boto3", "starlette", "uvicorn"]
