objects:
  get:
    tags: [homes]
    operationId: listObjects
    summary: Every remembered object with its last confident sighting
    parameters:
      - $ref: ../schemas/Params.yaml#/home_id
    responses:
      "200":
        description: Objects
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: ../schemas/ObjectLocation.yaml
      "404":
        $ref: ../schemas/Responses.yaml#/NotFound
object:
  patch:
    tags: [homes]
    operationId: correctObject
    summary: Fix what a scan was unsure about (name, colour, height, note) or confirm it
    parameters:
      - $ref: ../schemas/Params.yaml#/home_id
      - $ref: ../schemas/Params.yaml#/object_id
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: ../schemas/ObjectCorrection.yaml}
    responses:
      "200":
        description: The object as it is now remembered
        content:
          application/json:
            schema: {$ref: ../schemas/ObjectLocation.yaml}
      "404":
        $ref: ../schemas/Responses.yaml#/NotFound
      "422":
        $ref: ../schemas/Responses.yaml#/Invalid
  delete:
    tags: [homes]
    operationId: removeObject
    summary: Forget something a scan got wrong
    parameters:
      - $ref: ../schemas/Params.yaml#/home_id
      - $ref: ../schemas/Params.yaml#/object_id
    responses:
      "204":
        description: Forgotten
      "404":
        $ref: ../schemas/Responses.yaml#/NotFound
compass_route:
  get:
    tags: [guidance]
    operationId: getCompassRoute
    summary: Directions to a thing by compass bearing and metres, from where the room's scan began (for the Watch)
    description: >
      For walking without the phone's camera: the route starts where the scan of the thing's room began (usually the
      doorway) and is given as legs of a magnetic compass bearing and a distance, using the north the phone measured
      while scanning. 409 no_compass when that scan had no reliable compass; 409 no_path when no route is wide
      enough for a person.
    parameters:
      - $ref: ../schemas/Params.yaml#/home_id
      - $ref: ../schemas/Params.yaml#/object_id
    responses:
      "200":
        description: The route
        content:
          application/json:
            schema: {$ref: ../schemas/CompassRoute.yaml}
      "404":
        $ref: ../schemas/Responses.yaml#/NotFound
      "409":
        $ref: ../schemas/Responses.yaml#/Conflict
