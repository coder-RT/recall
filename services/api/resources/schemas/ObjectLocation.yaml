type: object
required: [object_id, label, position, height_band, seen_at, confidence]
properties:
  object_id: {type: string}
  label: {type: string}
  position: {type: array, items: {type: number}, minItems: 3, maxItems: 3}
  height_band: {type: string, enum: [floor, knee, waist, chest, head]}
  room: {type: [string, "null"]}
  landmark: {type: [string, "null"]}
  relation: {type: [string, "null"], enum: [on, left_of, right_of, near, null]}
  shelf_level: {type: [integer, "null"]}
  seen_at: {type: string, format: date-time}
  confidence: {type: number}
  stale: {type: boolean}
  color: {type: [string, "null"], description: "Basic colour name: the user's if they set one, else measured from the photo"}
  size_m: {type: [array, "null"], items: {type: number}, minItems: 3, maxItems: 3, description: "Bounding box x, y, z in metres"}
  corrections: {$ref: ObjectCorrection.yaml}
  needs_review: {type: boolean, description: "The models were unsure (confidence under 0.7) and the user hasn't confirmed it"}
