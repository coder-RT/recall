name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: uv sync
      - run: npx -y @redocly/cli@2.72.1 lint resources/openapi.yaml
      - run: mkdir -p build && npx -y @redocly/cli@2.72.1 bundle resources/openapi.yaml -o build/openapi.json
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run lint-imports
      - run: uv run pytest

  pipeline:
    # torch and MapAnything (several GB) are not installed in CI; no test needs them. Open3D, OpenCV and Pillow are:
    # the synthetic-room integration test runs the real pipeline on a ray-cast episode
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/pipeline
    env:
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Open3D's Linux wheel loads the system's EGL and OpenGL libraries even when nothing is drawn
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libgomp1
      - run: uvx ruff check . && uvx ruff format --check .
      - run: >-
          uv run --no-project --python 3.12 --with numpy --with scipy --with shapely --with pytest --with httpx
          --with opencv-python-headless --with open3d --with pillow --with pyyaml pytest
      - run: uv run --no-project --python 3.12 --with import-linter lint-imports

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @recall/web exec tsc --noEmit
      - run: pnpm --filter @recall/web lint
      - run: pnpm --filter @recall/web build
