# CodeQL: GitHub's built-in code scanning, free for public repos. No account or token needed.
# Swift is not scanned yet: it needs a macOS runner and the iOS project is not in the repo yet.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # add `python` once services/ (API and pipeline) is in the repo; CodeQL fails a language with no source
        language: [javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
