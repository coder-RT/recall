name: Recall
options:
  bundleIdPrefix: com.rachitthariani
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 4QM97V9YAR
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  RecallKit:
    path: Packages/RecallKit
targets:
  Recall:
    type: application
    platform: iOS
    sources:
      - path: Recall
    dependencies:
      - package: RecallKit
        product: RecallDomain
      - package: RecallKit
        product: RecallCapture
      - package: RecallKit
        product: RecallUpload
      - package: RecallKit
        product: RecallNetworking
      - package: RecallKit
        product: RecallVoice
      - package: RecallKit
        product: RecallDesign
      - package: RecallKit
        product: RecallApplication
      - package: RecallKit
        product: RecallPersistence
      - target: RecallWatch  # the Watch app, embedded: it installs with the iPhone app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rachitthariani.recall
        INFOPLIST_FILE: Recall/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Recall/Resources/Info.plist
      properties:
        CFBundleDisplayName: Recall
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiredDeviceCapabilities: [arm64, arkit]
        NSCameraUsageDescription: "Recall uses the camera and LiDAR to remember where things are in your home. Scans go to your own Mac, which sends their photos to Meta's SAM 3.1 to find things."
        NSMicrophoneUsageDescription: "Recall listens after you tap the microphone, so you can ask where something is. The recording goes to your own Mac, which sends it to Meta's Muse Voice Transcribe and keeps only the words."
        NSLocalNetworkUsageDescription: "Recall sends your scans to your own Mac on this network."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: com.rachitthariani.recall.pair
            CFBundleURLSchemes: [recall]
  RecallWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: RecallWatch
    dependencies:
      - package: RecallKit
        product: RecallDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rachitthariani.recall.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Recall
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.rachitthariani.recall
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Recall listens after it asks what to find. The recording goes through your iPhone to your own Mac, which sends it to Meta's Muse Voice Transcribe."
        INFOPLIST_KEY_NSMotionUsageDescription: "Recall counts your steps to know how far you have walked towards the thing."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Recall reads the compass to tap you towards the thing. Your location is not kept or sent."
  RecallUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RecallUITests
    dependencies:
      - target: Recall
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rachitthariani.recall.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Recall:
    build:
      targets:
        Recall: all
        RecallUITests: [test]
    test:
      targets:
        - RecallUITests
      environmentVariables:
        RECALL_SHOTS: /tmp/recall-shots
