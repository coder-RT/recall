openapi: 3.1.0
info:
  title: Recall API
  version: 0.1.0
  summary: Voice-first 3D memory of a home. Spec-first source of truth.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://localhost:8000
    description: The Mac (reach it from the phone over the LAN or a Cloudflare Tunnel)
security:
  - deviceKey: []
tags:
  - name: health
    description: Liveness; the only route without the device key
  - name: scans
    description: Resumable episode upload from the phone, and results from the pipeline
  - name: homes
    description: The remembered room model and objects
  - name: ask
    description: The Guide agent
  - name: guidance
    description: Routes and the arrival check
  - name: voice
    description: Speech to text through Muse Voice Transcribe
  - name: robots
    description: Read-only home memory for robots (off by default)
  - name: audit
    description: Who did what to the home's memory and its sharing (append-only, owner only)
  - name: a2a
    description: The Home Memory agent for other agents, over A2A 1.0 (off by default)
  - name: privacy
    description: What is kept on this Mac and what is sent where, under the current settings
components:
  securitySchemes:
    deviceKey:
      type: http
      scheme: bearer
      description: >
        A shared key from .env (RECALL_DEVICE_KEY), entered once on the phone and given to the pipeline. Pairing, not a
        login: the API is reachable through a Cloudflare Tunnel, so every route except /health needs it. A robot uses its
        own read-only key (RECALL_ROBOT_KEY) in the same header, for the robot export only.
paths:
  /health:
    $ref: paths/health.yaml#/health
  /scans:
    $ref: paths/scans.yaml#/scans
  /scans/{scan_id}:
    $ref: paths/scans.yaml#/scan
  /scans/{scan_id}/parts/{part_number}:
    $ref: paths/scans.yaml#/part
  /scans/{scan_id}/manifest:
    $ref: paths/scans.yaml#/manifest
  /scans/{scan_id}/complete:
    $ref: paths/scans.yaml#/complete
  /scans/{scan_id}/results:
    $ref: paths/scans.yaml#/results
  /homes/{home_id}/room:
    $ref: paths/homes.yaml#/room
  /homes/{home_id}/objects:
    $ref: paths/objects.yaml#/objects
  /sharing:
    $ref: paths/sharing.yaml#/sharing
  /trust:
    $ref: paths/trust.yaml#/trust
  /audit:
    $ref: paths/audit.yaml#/audit
  /privacy:
    $ref: paths/privacy.yaml#/privacy
  /answers/{answer_id}/evidence:
    $ref: paths/answers.yaml#/evidence
  /observations/{observation_id}/crop:
    $ref: paths/answers.yaml#/crop
  /homes/{home_id}/room-map:
    $ref: paths/homes.yaml#/room_map
  /homes/{home_id}/robot-package:
    $ref: paths/homes.yaml#/robot_package
  /homes/{home_id}/robot-export:
    $ref: paths/homes.yaml#/robot_export
  /a2a/home-memory:
    $ref: paths/a2a.yaml#/home_memory
  /a2a/home-memory/.well-known/agent-card.json:
    $ref: paths/a2a.yaml#/home_memory_card
  /homes/{home_id}/objects/{object_id}:
    $ref: paths/objects.yaml#/object
  /ask:
    $ref: paths/ask.yaml#/ask
  /guidance/sessions:
    $ref: paths/guidance.yaml#/sessions
  /guidance/sessions/{session_id}/verify:
    $ref: paths/guidance.yaml#/verify
  /transcribe:
    $ref: paths/voice.yaml#/transcribe
