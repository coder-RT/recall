ask:
  post:
    tags: [ask]
    operationId: ask
    summary: Ask where something is; the Guide agent answers from tool output only
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/AskRequest.yaml
    responses:
      "413":
        $ref: ../schemas/Responses.yaml#/TooLarge
      "429":
        $ref: ../schemas/Responses.yaml#/RateLimited
      "401":
        $ref: ../schemas/Responses.yaml#/Unauthorized
      "200":
        description: Grounded answer
        content:
          application/json:
            schema:
              $ref: ../schemas/Answer.yaml
      "503":
        $ref: ../schemas/Responses.yaml#/Unavailable
