transcribe:
  post:
    tags: [voice]
    operationId: transcribe
    summary: Speech to text through Muse Voice Transcribe (the only speech model)
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [audio]
            properties:
              audio:
                type: string
                format: binary
                description: The recorded question
    responses:
      "413":
        $ref: ../schemas/Responses.yaml#/TooLarge
      "429":
        $ref: ../schemas/Responses.yaml#/RateLimited
      "401":
        $ref: ../schemas/Responses.yaml#/Unauthorized
      "200":
        description: Transcript
        content:
          application/json:
            schema:
              $ref: ../schemas/Transcript.yaml
      "503":
        $ref: ../schemas/Responses.yaml#/Unavailable

reply:
  post:
    tags: [voice]
    operationId: readReply
    summary: What a spoken reply means after a find, read by Muse Spark Open as a strict JSON verdict
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../schemas/ReplyRequest.yaml
    responses:
      "401":
        $ref: ../schemas/Responses.yaml#/Unauthorized
      "429":
        $ref: ../schemas/Responses.yaml#/RateLimited
      "200":
        description: What the person wants next
        content:
          application/json:
            schema:
              $ref: ../schemas/ReplyIntent.yaml
